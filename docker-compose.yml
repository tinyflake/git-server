version: "3.8"

services:
    git-nginx:
        image: nginx:alpine
        container_name: git-nginx
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - ./logs:/var/log/nginx
        restart: always
        network_mode: "host"
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
