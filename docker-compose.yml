version: "3.8"

services:
    git-service:
        image: node:18-alpine
        container_name: git-service
        volumes:
            - ./:/app
        working_dir: /app
        command: sh -c "apk add --no-cache git && sh start.sh"
        restart: always
        network_mode: "host"

    git-nginx:
        image: nginx:alpine
        container_name: git-nginx
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - ./logs:/var/log/nginx
        restart: always
        network_mode: "host"
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
